services:
  mindex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_TELEGRAM_BOT_USERNAME=${VITE_TELEGRAM_BOT_USERNAME}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: mindex-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://mindex:mindex@postgres:5432/mindex
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: mindex-alloy
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      - GRAFANA_CLOUD_USER_ID=${GRAFANA_CLOUD_USER_ID}
      - GRAFANA_CLOUD_API_KEY=${GRAFANA_CLOUD_API_KEY}
    depends_on:
      mindex:
        condition: service_started
    restart: unless-stopped

  statsbot:
    build:
      context: ./statsbot
      dockerfile: Dockerfile
    container_name: mindex-statsbot
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mindex:mindex@postgres:5432/mindex
      - HTTPS_PROXY=http://user409503:9cm1p3@151.243.152.51:3096
      - HTTP_PROXY=http://user409503:9cm1p3@151.243.152.51:3096
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: mindex-db
    environment:
      - POSTGRES_USER=mindex
      - POSTGRES_PASSWORD=mindex
      - POSTGRES_DB=mindex
    volumes:
      - mindex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindex -d mindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mindex_pgdata: