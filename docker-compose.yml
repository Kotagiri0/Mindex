services:
  mindex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindex-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://mindex:mindex@postgres:5432/mindex}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mindex-db
    environment:
      - POSTGRES_USER=mindex
      - POSTGRES_PASSWORD=mindex
      - POSTGRES_DB=mindex
    ports:
      - "5432:5432"
    volumes:
      - mindex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindex -d mindex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mindex_pgdata: