name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          npm run test:unit | tee coverage.txt
          # Keep a minimal baseline while coverage improves.
          node -e "const fs=require('fs');const text=fs.readFileSync('coverage.txt','utf8');const match=text.match(/All files\\s*\\|\\s*([0-9.]+)%/);if(!match){console.error('Coverage summary not found.');process.exit(1);}const percent=parseFloat(match[1]);console.log(`Coverage: ${percent}%`);if(percent<35){console.error('Coverage below 35%.');process.exit(1);}"

      - name: Integration tests
        run: npm run test:integration

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
