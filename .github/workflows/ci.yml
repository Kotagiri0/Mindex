name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache npm downloads to speed up installs across runs.
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: |
          npm run test:unit | tee coverage.txt

      # Generate a lightweight SVG badge from the coverage output.
      - name: Create coverage badge
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('coverage.txt', 'utf8');
          const match = text.match(/All files\s*\|\s*([0-9.]+)%/);
          const percent = match ? match[1] : '0';
          const label = 'coverage';
          const color = Number(percent) >= 80 ? '#4c1' : '#e05d44';
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20">
            <linearGradient id="b" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient>
            <mask id="a"><rect width="120" height="20" rx="3" fill="#fff"/></mask>
            <g mask="url(#a)"><rect width="60" height="20" fill="#555"/><rect x="60" width="60" height="20" fill="${color}"/><rect width="120" height="20" fill="url(#b)"/></g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="30" y="14">${label}</text>
              <text x="90" y="14">${percent}%</text>
            </g>
          </svg>`;
          fs.writeFileSync('coverage-badge.svg', svg);
          NODE

      - name: Upload coverage badge
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: coverage-badge.svg

      - name: Integration tests
        run: npm run test:integration

      # Security audit uses npm's built-in vulnerability scanner.
      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
