name: CI

on:
  pull_request:
    branches: [copilot/create-ci-cd-pipeline]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: []
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      NODE_ENV: ${{ secrets.NODE_ENV }}
      PORT: ${{ secrets.PORT }}
      APP_URL: ${{ secrets.APP_URL }}
      MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
      ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
      GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      GRAFANA_CLOUD_USER_ID: ${{ secrets.GRAFANA_CLOUD_USER_ID }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: |
          set -euo pipefail
          npm run test:unit | tee coverage.txt
          # Fail the job if the summarized coverage drops below 80%.
          node -e "const fs=require('fs');const text=fs.readFileSync('coverage.txt','utf8');const match=text.match(/All files\s*\|\s*([0-9.]+)%/);if(!match){console.error('Coverage summary not found.');process.exit(1);}const percent=parseFloat(match[1]);console.log(`Coverage: ${percent}%`);if(percent<80){console.error('Coverage below 80%.');process.exit(1);}"

      - name: Integration tests
        run: npm run test:integration

  security:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

  build:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Cache npm downloads using the lockfile hash to speed up installs.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
